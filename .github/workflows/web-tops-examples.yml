# The browser examples gate themselves at `hard`, as examples/node-service does, and each planted build-output defect
# is then shown red over them (milestone M4). The kit's own gate is in web-tops.yml.
name: web-tops-examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: examples/astro-site
      # The built-page layers drive the Chromium of the pinned Playwright.
      - run: bunx playwright install --with-deps chromium
      - run: bun ../../src/cli/main.ts gate --max-tier 1
        working-directory: examples/astro-site
      - run: bash fixtures/plants/run.sh
