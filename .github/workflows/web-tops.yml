# The kit gates itself: the one `gate` job of WEB_TOPS.md section 11, run from source.
name: web-tops

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # One job, two operating systems: every leg runs the same steps (WEB_TOPS.md section 11).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun src/cli/main.ts gate --max-tier 1
      # Diagnostic: what Stryker said about each mutant, and which test killed it (removed again once read).
      - if: always()
        run: |
          bun -e 'const r = await Bun.file(".web-tops/out/mutation/mutation.json").json(); const names = {}; for (const f of Object.values(r.testFiles ?? {})) for (const t of f.tests) names[t.id] = t.name; for (const [file, v] of Object.entries(r.files)) for (const m of v.mutants) console.log(file, m.location.start.line, m.mutatorName, m.status, "killedBy=" + JSON.stringify((m.killedBy ?? []).map((id) => names[id] ?? id)), "reason=" + (m.statusReason ?? "").slice(0, 200), "covered=" + (m.coveredBy ?? []).length)'
