# The kit gates itself with 2-shard mutation (WEB_TOPS.md sections 6.4 and 11), preserving the
# required `gate (ubuntu-latest)` and `gate (macos-latest)` check contexts via the join job.
name: web-tops

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate-shard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The example project is reached by the root tsconfig references and gates itself with the kit's source.
      - run: bun install --frozen-lockfile
        working-directory: examples/node-service
      - run: bun src/cli/main.ts gate --max-tier 1 --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-partial-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}
          path: .web-tops/out/mutation/partial.json

  gate:
    needs: [gate-shard]
    # Preserves `gate (ubuntu-latest)` and `gate (macos-latest)` check contexts for branch protection.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The example project is reached by the root tsconfig references and gates itself with the kit's source.
      - run: bun install --frozen-lockfile
        working-directory: examples/node-service
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-partial-${{ matrix.os }}-*-${{ github.run_id }}
          path: .web-tops/out/shards
      - run: bun src/cli/main.ts gate --join .web-tops/out/shards
      - run: bun ../../src/cli/main.ts gate --max-tier 1
        working-directory: examples/node-service
