# The kit gates itself: class ts-library, enforce hard (WEB_TOPS.md section 6.7). The layers that
# land after M1 are off, each with the milestone that turns it on.
protocol: "0.3.0"
version: "0.3.0"
package: web-tops
class: ts-library
enforce: hard
baseline: .web-tops/baseline.json

toolchain:
  typescript: "6.0.3"
  runtime: bun

gates:
  hygiene:
    # No `config`: ESLint looks its config up from each file's directory, so the example project is linted under its own.
    format: { tool: prettier }
    astro_check: { enabled: false, reason: "ts-library: no .astro files" }
    stylelint: { enabled: false, reason: "ts-library: no CSS" }
    audit: { fail_on: high }
  tests:
    runner: vitest
    shuffle: true
  coverage:
    lines_floor: 85
    exclude:
      - { glob: "src/**/test-support*.ts", reason: "test helpers: no production code" }
      - {
          glob: "src/**/testkit.ts",
          reason: "test helpers: the gate runner's fixtures, no production code",
        }
  crap:
    cap: 4
    scope: all
  mutation:
    engine: stryker
    scope: diff
    base: origin/main
    unexplained_survivors_max: 0
    time_budget_minutes: 40
    ledger: .web-tops/survivors.yaml

layers:
  size_limit:
    {
      enabled: false,
      reason: "M4: size-limit per entry lands with the build-output layers in milestone M4",
    }
  package_exports: { tier: 1 }
  html_validate:
    {
      enabled: false,
      reason: "M4: ts-library has no HTML output; build-output layers land in milestone M4",
    }
  axe:
    {
      enabled: false,
      reason: "M4: ts-library has no pages; build-output layers land in milestone M4",
    }
  rendered:
    { enabled: false, reason: "M4: ts-library has no pages; rendered checks land in milestone M4" }
  themes:
    {
      enabled: false,
      reason: "M4: ts-library has no themes; the theme reader lands in milestone M4",
    }

laws:
  enabled: false
  reason: "M3: the laws layer lands in milestone M3"

report:
  path: .web-tops/report.json
