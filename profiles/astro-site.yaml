# Drop-in profile for class astro-site: the data `webtops init` renders from (WEB_TOPS.md sections 4, 5.2, 7).
# A layer listed under `disabled` is written `enabled: false` with that reason; every other layer stays on.
class: astro-site
coverage_floor: 70
crap_cap: 6
survivors_max: 2
js_budget: "0 KB (50 KB with islands)"
playwright: true
eslint: astro
tools:
  - "@astrojs/check"
  - "@eslint-community/eslint-plugin-eslint-comments"
  - "@eslint/js"
  - "@playwright/test"
  - "@vitest/coverage-v8"
  - "@vitest/eslint-plugin"
  - "astro"
  - "dependency-cruiser"
  - "eslint"
  - "eslint-plugin-astro"
  - "eslint-plugin-jsx-a11y"
  - "prettier"
  - "stylelint"
  - "typescript"
  - "typescript-eslint"
  - "vitest"
disabled:
  package_exports: "not mapped for class: a site publishes no package exports"
  crap: "milestone M2: native CRAP lands in M2"
  mutation: "milestone M2: mutation testing lands in M2"
  size_limit: "not mapped for class: a site publishes no package entries"
  html_validate: "milestone M4: build-output layers land in M4"
  axe: "milestone M4: build-output layers land in M4"
  rendered: "milestone M4: rendered checks land in M4"
  themes: "milestone M4: the theme reader lands in M4"
