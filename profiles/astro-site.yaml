# Drop-in profile for class astro-site: the data `webtops init` renders from (WEB_TOPS.md sections 4, 5.2, 7).
# A layer listed under `disabled` is written `enabled: false` with that reason; every other layer stays on.
class: astro-site
coverage_floor: 70
crap_cap: 6
survivors_max: 2
js_budget: "0 KB (50 KB with islands)"
playwright: true
eslint: astro
tools:
  - "@eslint-community/eslint-plugin-eslint-comments"
  - "@eslint/js"
  - "@playwright/test"
  - "@vitest/coverage-v8"
  - "@vitest/eslint-plugin"
  - "dependency-cruiser"
  - "eslint"
  - "eslint-plugin-astro"
  - "eslint-plugin-jsx-a11y-x"
  - "postcss-html"
  - "prettier"
  - "stylelint"
  - "typescript"
  - "typescript-eslint"
  - "vitest"
disabled:
  package_exports: "not mapped for class: a site publishes no package exports"
  crap: "milestone M2: native CRAP lands in M2"
  mutation: "milestone M2: mutation testing lands in M2"
  size_limit: "not mapped for class: a site publishes no package entries"
  html_validate: "not set up by `webtops init`: it writes no `build` and installs no html-validate"
  axe: "not set up by `webtops init`: it writes no `build` and installs no @axe-core/playwright"
  rendered: "not built yet: there is no reader for rendered checks"
  themes: "not built yet: there is no theme reader"
  laws: "milestone M3: the laws layer lands in M3"
