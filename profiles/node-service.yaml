# Drop-in profile for class node-service: the data `webtops init` renders from (WEB_TOPS.md sections 4, 5.2, 7).
# A layer listed under `disabled` is written `enabled: false` with that reason; every other layer stays on.
class: node-service
coverage_floor: 80
crap_cap: 5
survivors_max: 1
js_budget: "n/a"
playwright: false
eslint: base
tools:
  - "@eslint-community/eslint-plugin-eslint-comments"
  - "@eslint/js"
  - "@vitest/coverage-v8"
  - "@vitest/eslint-plugin"
  - "dependency-cruiser"
  - "eslint"
  - "prettier"
  - "typescript"
  - "typescript-eslint"
  - "vitest"
disabled:
  stylelint: "not mapped for class: a service has no CSS"
  package_exports: "not mapped for class: a service publishes no package exports"
  crap: "milestone M2: native CRAP lands in M2"
  mutation: "milestone M2: mutation testing lands in M2"
  size_limit: "not mapped for class: a service publishes no package entries"
  html_validate: "not mapped for class: a service has no HTML output"
  axe: "not mapped for class: a service has no pages"
  rendered: "not mapped for class: a service has no pages"
  themes: "not mapped for class: a service has no themes"
  laws: "milestone M3: the laws layer lands in M3"
