# Example web-tops.yaml for class web-app: what `webtops init --class web-app` writes, kept valid by a test.
# Written by `webtops init` (WEB_TOPS.md sections 4 and 9). Under `hard`, only crap, mutation, build
# output and laws may be off for a class that maps them: they are `enabled: false` with the milestone
# that adds them. A layer the class does not map is off with the class as the reason.
protocol: 0.3.0
version: 1.0.0
package: site
class: web-app
enforce: hard
baseline: .web-tops/baseline.json
toolchain:
  typescript: 6.0.3
  runtime: bun
gates:
  hygiene:
    eslint:
      config: eslint.config.js
    format:
      tool: prettier
    astro_check:
      enabled: false
      reason: "not mapped for class: this project lists no astro dependency"
    stylelint: {}
    audit:
      fail_on: high
  tests:
    runner: vitest
    shuffle: true
  coverage:
    lines_floor: 70
  crap:
    cap: 6
    scope: diff
    complexity:
      nullish_discount: true
    enabled: false
    reason: "milestone M2: native CRAP lands in M2"
  mutation:
    engine: stryker
    scope: diff
    base: origin/main
    unexplained_survivors_max: 2
    ledger: .web-tops/survivors.yaml
    enabled: false
    reason: "milestone M2: mutation testing lands in M2"
layers:
  size_limit:
    tier: 1
    enabled: false
    reason: "not mapped for class: an app publishes no package entries"
  package_exports:
    tier: 1
    enabled: false
    reason: "not mapped for class: an app publishes no package exports"
  html_validate:
    enabled: false
    reason: "milestone M4: build-output layers land in M4"
  axe:
    enabled: false
    reason: "milestone M4: build-output layers land in M4"
  rendered:
    enabled: false
    reason: "milestone M4: rendered checks land in M4"
    routes: ["/"]
    widths: [1280, 320]
    reduced_motion: true
  themes:
    enabled: false
    reason: "milestone M4: the theme reader lands in M4"
    switch: { mechanism: attribute, name: data-theme }
    schemes: [light, dark]
    tokens: ["--color-bg", "--color-fg"]
  custom: []
laws:
  select: default
  ack_ledger: .web-tops/acks.yaml
  enabled: false
  reason: "milestone M3: the laws layer lands in M3"
report:
  path: .web-tops/report.json
