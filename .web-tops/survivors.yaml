# .web-tops/survivors.yaml: mutants a test does not kill and a person has accepted (WEB_TOPS.md 6.4).
# An entry is keyed by file, function, mutator, original, replacement and occurrence, never by a line.
# `original` is the exact source text the mutator replaced, as written, so editing that text makes a
# new key and the old entry stops matching. Add entries with `webtops survivors explain`; every entry
# needs a reason and an owner, and may carry `expires` (YYYY-MM-DD, UTC, valid through that day).
version: 1
survivors:
  - file: src/census/directives.ts
    function: src/census/directives.ts::astroTemplate
    mutator: StringLiteral
    original: "\" \""
    replacement: "\"\""
    occurrence: 1
    reason: A blanked code character only has to keep the line breaks; leaving it
      out instead changes columns, and the census reads lines.
    owner: web-platform
  - file: src/census/tsconfig.ts
    function: src/census/tsconfig.ts::readHits
    mutator: StringLiteral
    original: "\" \""
    replacement: "\"\""
    occurrence: 1
    reason: The separator only shows in a diagnostic that is a chain of messages;
      the syntax error tsc reports for a tsconfig.json is a single message.
    owner: web-platform
  - file: src/census/tsconfig.ts
    function: src/census/tsconfig.ts::withoutExclude
    mutator: ArrayDeclaration
    original: "[]"
    replacement: "[\"Stryker was here\"]"
    occurrence: 1
    reason: The array only has to be empty; a one-element array holding a pattern
      that matches nothing empties the exclude just as well, so no test can tell
      them apart.
    owner: web-platform
  - file: src/cli/doctor.ts
    function: src/cli/doctor.ts::playwrightCheck
    mutator: StringLiteral
    original: "\"?\""
    replacement: "\"\""
    occurrence: 1
    reason: playwrightCheck returns before this line when the class is undefined, so
      className is always a string here; the fallback is a dead branch the types
      require.
    owner: web-platform
  - file: src/cli/lock.ts
    function: src/cli/lock.ts::confirm
    mutator: StringLiteral
    original: "\"?\""
    replacement: "\"\""
    occurrence: 1
    reason: confirm runs only when verify found no problem, which needs a Node on
      the PATH inside the lock's range; the fallback is a dead branch the types
      require.
    owner: web-platform
  - file: src/cli/lock.ts
    function: src/cli/lock.ts::parseMode
    mutator: StringLiteral
    original: "\"\""
    replacement: "\"Stryker was here!\""
    occurrence: 1
    reason: parseMode reads argv[0] only when argv.length is 1, so it is never
      undefined; the fallback is a dead branch the types require.
    owner: web-platform
  - file: src/cli/lock.ts
    function: src/cli/lock.ts::toolProblems
    mutator: StringLiteral
    original: "\"?\""
    replacement: "\"\""
    occurrence: 1
    reason: toolProblems visits the keys of the lock, so lock[tool] is never
      undefined; the fallback is a dead branch the types require.
    owner: web-platform
  - file: src/cli/main.ts
    function: src/cli/main.ts::<module>
    mutator: BlockStatement
    original: "{

      \  process.exitCode = await main(process.argv, stdio);

      }"
    replacement: "{}"
    occurrence: 1
    reason: "The mutation runner cannot mutate a spawned process, and only a spawned
      bun reaches the import.meta.main guard (an import under test never
      satisfies it). The spawn tests in main.test.ts (bun src/cli/main.ts: an
      unknown command exits 2, and check exits 0 and 2) cover it."
    owner: web-platform
  - file: src/cli/main.ts
    function: src/cli/main.ts::<module>
    mutator: ConditionalExpression
    original: "import.meta.main"
    replacement: "false"
    occurrence: 1
    reason: "The mutation runner cannot mutate a spawned process, and only a spawned
      bun reaches the import.meta.main guard (an import under test never
      satisfies it). The spawn tests in main.test.ts (bun src/cli/main.ts: an
      unknown command exits 2, and check exits 0 and 2) cover it."
    owner: web-platform
  - file: src/cli/main.ts
    function: src/cli/main.ts::<module>
    mutator: ConditionalExpression
    original: "import.meta.main"
    replacement: "true"
    occurrence: 1
    reason: "The mutation runner cannot mutate a spawned process, and only a spawned
      bun reaches the import.meta.main guard (an import under test never
      satisfies it). The spawn tests in main.test.ts (bun src/cli/main.ts: an
      unknown command exits 2, and check exits 0 and 2) cover it."
    owner: web-platform
  - file: src/config/profiles.ts
    function: src/config/profiles.ts::lawIds
    mutator: StringLiteral
    original: "\"0\""
    replacement: "\"\""
    occurrence: 1
    reason: lawIds is called with ids of two digits (20 to 31, 42 to 46), where
      padStart has nothing to pad; the pad character cannot show.
    owner: web-platform
  - file: src/config/validate.ts
    function: src/config/validate.ts::loadConfig
    mutator: StringLiteral
    original: "\"unknown error\""
    replacement: "\"\""
