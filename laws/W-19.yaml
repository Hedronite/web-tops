id: W-19
title: "Optional peers (React, R3F) are imported only from entries that declare them"
family: "Modules and boundaries"
severity: R
classes: [ts-library, ui-components, astro-site, web-app, node-service]
reader:
  kinds: [tl]
  text: "tl: `dependency-cruiser`"
rules:
  - { tool: dependency-cruiser, name: "no-optional-peer-import" }
judged: v0.1
rationale: "An optional peer imported from an entry that does not declare it breaks installs that skip the peer."
fix: "Import the peer only from entries that declare it, or declare it for the entry."
